# Wallonia's working calendar for the CWaPE deadlines: the ten Belgian legal
# public holidays (loi du 4 janvier 1974), 2026-2035. Data on purpose, not a
# formula: a reviewer can read and diff it, and engine/calendar.py refuses a
# day past 2035 instead of guessing. Extend the range before it runs out
# (tests/regulators/cwape/test_calendar.py fails a year ahead).
#
# Open questions (spec, "Risques"): whether a CWaPE "jour ouvrable" counts
# Saturdays (saturday_is_working), and whether the Walloon regional days
# (27 September) count. Both are a change here, not in code.
region: WAL
saturday_is_working: false
years: {from: 2026, to: 2035}
holidays:
  - {day: 2026-01-01, label: Nouvel An}
  - {day: 2026-04-06, label: Lundi de Pâques}
  - {day: 2026-05-01, label: Fête du Travail}
  - {day: 2026-05-14, label: Ascension}
  - {day: 2026-05-25, label: Lundi de Pentecôte}
  - {day: 2026-07-21, label: Fête nationale}
  - {day: 2026-08-15, label: Assomption}
  - {day: 2026-11-01, label: Toussaint}
  - {day: 2026-11-11, label: Armistice}
  - {day: 2026-12-25, label: Noël}
