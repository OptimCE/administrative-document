# Authorization of a new sharing operation: the reference GRD, then the CWaPE.
# The spec gives it the delays of the authorization route of a modification,
# "à confirmer pour une création". No trigger before phase 4: created by hand
# (or by migration 0003 from a July SHARING_AUTHORIZATION dossier).
code: PARTAGE_AUTORISATION
version: 1
valid_from: 2026-01-01
scope: operation
recipient: grd_ref
channel: email
family: PARTAGE_AUTORISATION
handles_change_kinds: []
labels: {fr: Autorisation de partage, en: Sharing authorisation, nl: Deelmachtiging, de: Teilungsgenehmigung}

initial_step: draft
steps:
  - code: draft
    status: draft
    bucket: todo
    next_action:
      code: complete_documents
      labels: {fr: Compléter les pièces, en: Complete the documents, nl: De documenten aanvullen, de: Die Unterlagen vervollständigen}
    labels: {fr: Brouillon, en: Draft, nl: Concept, de: Entwurf}
  - code: ready
    status: ready
    bucket: todo
    next_action:
      code: send
      labels: {fr: Envoyer la demande d'autorisation, en: Send the authorisation request, nl: De machtigingsaanvraag versturen, de: Den Genehmigungsantrag senden}
    labels: {fr: Prêt, en: Ready, nl: Klaar, de: Bereit}
  - code: sent
    status: sent
    bucket: waiting
    next_action:
      code: record_response
      labels: {fr: Accusé de complétude du GRD attendu, en: Awaiting the DSO's completeness check, nl: Wachten op de volledigheidscontrole van de netbeheerder, de: Vollständigkeitsprüfung des Netzbetreibers erwartet}
    labels: {fr: Envoyé, en: Sent, nl: Verstuurd, de: Gesendet}
  - code: incomplete
    status: sent
    bucket: todo
    next_action:
      code: record_response
      labels: {fr: Envoyer les compléments, en: Send the additional information, nl: De aanvullingen versturen, de: Die Ergänzungen senden}
    labels: {fr: Incomplet, en: Incomplete, nl: Onvolledig, de: Unvollständig}
  - code: in_review
    status: sent
    bucket: waiting
    next_action:
      code: record_response
      labels: {fr: Avis du GRD attendu, en: Awaiting the DSO's opinion, nl: Wachten op het advies van de netbeheerder, de: Stellungnahme des Netzbetreibers erwartet}
    labels: {fr: En instruction, en: Under review, nl: In behandeling, de: In Prüfung}
  - code: at_regulator
    status: sent
    bucket: waiting
    next_action:
      code: record_response
      labels: {fr: Décision de la CWaPE attendue, en: Awaiting the CWaPE's decision, nl: Wachten op de beslissing van de CWaPE, de: Entscheidung der CWaPE erwartet}
    labels: {fr: Instruction CWaPE, en: Under CWaPE review, nl: In behandeling bij de CWaPE, de: In Prüfung bei der CWaPE}
  - code: non_conformity
    status: sent
    bucket: todo
    next_action:
      code: record_response
      labels: {fr: Répondre à la CWaPE, en: Reply to the CWaPE, nl: De CWaPE antwoorden, de: Der CWaPE antworten}
    labels: {fr: Non-conformité, en: Non-conformity, nl: Niet-conformiteit, de: Nichtkonformität}
  - code: granted
    status: sent
    bucket: waiting
    next_action:
      code: record_response
      labels: {fr: Convention du GRD attendue, en: Awaiting the DSO's agreement, nl: Wachten op de overeenkomst van de netbeheerder, de: Vertrag des Netzbetreibers erwartet}
    labels: {fr: Autorisé, en: Authorised, nl: Gemachtigd, de: Genehmigt}
  - code: accepted
    status: sent
    bucket: todo
    next_action:
      code: record_response
      labels: {fr: Renvoyer la convention signée, en: Return the signed agreement, nl: De ondertekende overeenkomst terugsturen, de: Den unterzeichneten Vertrag zurücksenden}
    labels: {fr: Accepté, en: Accepted, nl: Aanvaard, de: Angenommen}
  - code: agreement_signed
    status: sent
    bucket: planned
    next_action: {code: none}
    labels: {fr: Convention signée, en: Agreement signed, nl: Overeenkomst ondertekend, de: Vertrag unterzeichnet}
  - code: in_force
    status: in_force
    bucket: done
    next_action: {code: none}
    labels: {fr: En vigueur, en: In force, nl: Van kracht, de: In Kraft}
  - code: refused
    status: refused
    bucket: done
    next_action: {code: none}
    labels: {fr: Refusé, en: Refused, nl: Geweigerd, de: Abgelehnt}
  - code: cancelled
    status: cancelled
    bucket: done
    next_action: {code: none}
    labels: {fr: Annulé, en: Cancelled, nl: Geannuleerd, de: Storniert}
  - code: lapsed
    status: lapsed
    bucket: done
    next_action: {code: none}
    labels: {fr: Caduc, en: Lapsed, nl: Vervallen, de: Verfallen}

transitions:
  - {from: draft, to: ready, automatic: true}
  - {from: ready, to: draft, automatic: true}
  - {from: draft, to: cancelled}
  - {from: ready, to: cancelled}
  - {from: ready, to: sent}
  - {from: sent, to: incomplete}
  - {from: incomplete, to: sent}
  - {from: incomplete, to: lapsed}
  - {from: sent, to: in_review}
  - {from: in_review, to: at_regulator}
  - {from: at_regulator, to: non_conformity}
  - {from: non_conformity, to: at_regulator}
  - {from: non_conformity, to: refused}
  - {from: at_regulator, to: refused}
  - {from: at_regulator, to: granted}
  - {from: granted, to: accepted}
  - {from: accepted, to: agreement_signed}
  - {from: agreement_signed, to: in_force, automatic: true}
  - {from: in_force, to: refused}

response_types:
  - code: sent
    direction: outbound
    counterparty: grd
    to_step: sent
    labels: {fr: Envoi, en: Sending, nl: Verzending, de: Versand}
  - code: receipt
    direction: inbound
    counterparty: grd
    labels: {fr: Accusé de réception, en: Acknowledgement of receipt, nl: Ontvangstbevestiging, de: Empfangsbestätigung}
  - code: completeness_ack
    direction: inbound
    counterparty: grd
    to_step: in_review
    labels: {fr: Accusé de complétude, en: Completeness acknowledgement, nl: Bevestiging van volledigheid, de: Vollständigkeitsbestätigung}
  - code: incomplete_notice
    direction: inbound
    counterparty: grd
    to_step: incomplete
    labels: {fr: Demande de compléments, en: Request for additional information, nl: Verzoek om aanvullingen, de: Nachforderung von Unterlagen}
  - code: technical_opinion
    direction: inbound
    counterparty: grd
    to_step: at_regulator
    labels: {fr: Avis technique transmis à la CWaPE, en: Technical opinion sent to the CWaPE, nl: Technisch advies aan de CWaPE bezorgd, de: Technische Stellungnahme an die CWaPE übermittelt}
  - code: non_conformity
    direction: inbound
    counterparty: regulator
    to_step: non_conformity
    labels: {fr: Invitation à se conformer, en: Request to comply, nl: Verzoek tot conformering, de: Aufforderung zur Konformität}
  - code: non_conformity_reply
    direction: outbound
    counterparty: regulator
    to_step: at_regulator
    labels: {fr: Réponse à l'invitation à se conformer, en: Reply to the request to comply, nl: Antwoord op het verzoek tot conformering, de: Antwort auf die Aufforderung zur Konformität}
  - code: decision_granted
    direction: inbound
    counterparty: regulator
    to_step: granted
    labels: {fr: Décision d'autorisation, en: Authorisation decision, nl: Machtigingsbeslissing, de: Genehmigungsentscheidung}
  - code: decision_refused
    direction: inbound
    counterparty: regulator
    to_step: refused
    labels: {fr: Décision de refus, en: Refusal decision, nl: Weigeringsbeslissing, de: Ablehnungsentscheidung}
  - code: agreement_proposal
    direction: inbound
    counterparty: grd
    to_step: accepted
    labels: {fr: Proposition de convention, en: Agreement proposal, nl: Voorstel van overeenkomst, de: Vertragsvorschlag}
  - code: agreement_signed
    direction: outbound
    counterparty: grd
    to_step: agreement_signed
    labels: {fr: Convention signée renvoyée, en: Signed agreement returned, nl: Ondertekende overeenkomst teruggestuurd, de: Unterzeichneter Vertrag zurückgesandt}
  - code: other
    direction: inbound
    counterparty: other
    labels: {fr: Autre, en: Other, nl: Andere, de: Sonstiges}

deadline_rules:
  - code: completeness
    kind: relative
    anchor: step:sent
    offset: {value: 10, unit: working_days}
    party: grd
    deadline_kind: response
    closes_on: [response:completeness_ack, response:incomplete_notice]
    labels: {fr: Contrôle de complétude, en: Completeness check, nl: Volledigheidscontrole, de: Vollständigkeitsprüfung}
  - code: lapse
    kind: relative
    anchor: response:incomplete_notice
    offset: {value: 6, unit: months}
    party: community
    deadline_kind: lapse
    closes_on: [step:sent]
    labels: {fr: Compléments avant caducité, en: Additional information before lapse, nl: Aanvullingen vóór verval, de: Ergänzungen vor dem Verfall}
  - code: grd_opinion
    kind: relative
    anchor: response:completeness_ack
    offset: {value: 20, unit: working_days}
    party: grd
    deadline_kind: response
    closes_on: [response:technical_opinion]
    labels: {fr: Avis du GRD, en: DSO opinion, nl: Advies van de netbeheerder, de: Stellungnahme des Netzbetreibers}
  - code: regulator_decision
    kind: relative
    anchor: response:technical_opinion
    offset: {value: 40, unit: working_days}
    party: regulator
    deadline_kind: response
    closes_on: [response:decision_granted, response:decision_refused, response:non_conformity]
    labels: {fr: Décision de la CWaPE, en: CWaPE decision, nl: Beslissing van de CWaPE, de: Entscheidung der CWaPE}
  - code: non_conformity_reply
    kind: relative
    anchor: response:non_conformity
    offset: {value: 2, unit: months}
    party: community
    deadline_kind: submission
    closes_on: [response:non_conformity_reply]
    labels: {fr: Réponse à la CWaPE, en: Reply to the CWaPE, nl: Antwoord aan de CWaPE, de: Antwort an die CWaPE}
  - code: agreement_return
    kind: relative
    anchor: response:agreement_proposal
    offset: {value: 10, unit: working_days}
    party: community
    deadline_kind: submission
    closes_on: [response:agreement_signed]
    labels: {fr: Renvoi de la convention signée, en: Return of the signed agreement, nl: Terugzending van de ondertekende overeenkomst, de: Rücksendung des unterzeichneten Vertrags}
  - code: effect
    kind: relative
    anchor: response:agreement_signed
    offset: {value: 20, unit: working_days}
    party: grd
    deadline_kind: effect
    closes_on: [step:in_force]
    labels: {fr: Prise d'effet, en: Takes effect, nl: Inwerkingtreding, de: Inkrafttreten}
  - code: appeal_annulment
    kind: relative
    anchor: response:decision_refused
    offset: {value: 30, unit: calendar_days}
    party: community
    deadline_kind: submission
    labels: {fr: Recours en annulation, en: Action for annulment, nl: Beroep tot nietigverklaring, de: Nichtigkeitsklage}
  - code: appeal_review
    kind: relative
    anchor: response:decision_refused
    offset: {value: 2, unit: months}
    party: community
    deadline_kind: submission
    labels: {fr: Demande de réexamen, en: Request for review, nl: Verzoek tot heroverweging, de: Antrag auf Überprüfung}

documents:
  - code: sharing_notification
    kind: generated
    template: sharing_notification
    labels: {fr: Formulaire de notification de partage, en: Sharing notification form, nl: Kennisgevingsformulier delen, de: Meldeformular Teilung}
  - code: annex6_sharing_form
    kind: generated
    template: annex6_sharing_form
    labels: {fr: Annexe 6 – formulaire de partage, en: Annex 6 – sharing form, nl: Bijlage 6 – deelformulier, de: Anlage 6 – Teilungsformular}
  - code: annex8_sworn_declaration
    kind: collected
    per_member: true          # one per participant, generated then signed
    template: annex8_sworn_declaration
    labels: {fr: Annexe 8 – déclaration sur l'honneur, en: Annex 8 – sworn declaration, nl: Bijlage 8 – verklaring op erewoord, de: Anlage 8 – eidesstattliche Erklärung}
  - code: producer_status_proof
    kind: collected
    condition: new_installation
    labels: {fr: Preuve du statut de producteur, en: Proof of producer status, nl: Bewijs van producentenstatus, de: Nachweis des Erzeugerstatus}
  - code: key_description
    kind: generated
    condition: non_standard_key
    labels: {fr: Description et formules de la clé, en: Key description and formulas, nl: Beschrijving en formules van de verdeelsleutel, de: Beschreibung und Formeln des Schlüssels}
  # The GRD agreement is signed after the decision (agreement_proposal), so
  # neither one holds the draft back.
  - code: dso_agreement_community
    kind: generated
    required: false
    condition: community_operation
    template: dso_agreement_community
    labels: {fr: Contrat GRD – communauté, en: DSO agreement – community, nl: Overeenkomst netbeheerder – gemeenschap, de: Netzbetreibervertrag – Gemeinschaft}
  - code: dso_agreement_building
    kind: generated
    required: false
    condition: same_building_operation
    template: dso_agreement_building
    labels: {fr: Contrat GRD – même bâtiment, en: DSO agreement – same building, nl: Overeenkomst netbeheerder – zelfde gebouw, de: Netzbetreibervertrag – selbes Gebäude}
  - code: community_modification
    kind: generated
    condition: community_update_attached
    template: community_modification
    labels: {fr: Formulaire de modification de communauté, en: Community modification form, nl: Wijzigingsformulier gemeenschap, de: Änderungsformular Gemeinschaft}
